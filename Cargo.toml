[package]
name = "css-module-lexer"
version = "0.1.1"
edition = "2024"
description = "Lexes CSS modules returning their dependencies metadata"
license = "MIT"
repository = "https://github.com/ahabhgk/css-module-lexer"

[dependencies]
bitflags = "2"
rustc-hash = "2"
smallvec = "1.15.2"

[dev-dependencies]
codspeed-criterion-compat = "2"
criterion = "0.5"
indoc = "2"
linked-hash-map = "0.5"
similar-asserts = "1"

[[bench]]
name = "main"
harness = false
